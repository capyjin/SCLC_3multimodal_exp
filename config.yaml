# Tri-modal (image + clinical + report) fusion experiments.
# Paths are relative to this file's directory.

paths:
  merged_csv: DATA/merged_tabular_with_reports.csv
  image_dir: DATA/CUT IMAGE
  split_csv: splits/trimodal_common_5fold_seed42_v1.csv
  output_dir: outputs

experiment:
  target: all          # os | pfs | all
  cohort_rule: "research_id intersect of image+clinical baseline (257) and report_common (238) == report_common (238); reuses report_common_5fold_seed42_v1.csv unchanged"

reproducibility:
  seed: 42
  n_splits: 5

model:
  resize: 512
  gray_scale: true
  image_proj_dim: 128
  image_dropout: 0.2
  clinical_hidden: [128, 128, 128, 128]
  clinical_dropout: 0.5
  report_hidden: [32, 16]
  report_dropout: 0.3
  fusion_dropout: 0.3
  tfidf_max_features: 400
  tfidf_ngram_range: [2, 4]

training:
  batch_size: 16
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 4
